# 방문 기록 - 직접 경험한 사실만 적어 주세요.
# 초안은 여기 적힌 내용과 photos/ 폴더의 사진만 근거로 쓰입니다. 비워 둔 항목은 글에 나오지 않아요.

place:
  name: "{name}"
  type: 카페            # 카페 / 음식점 / 베이커리 / 술집 ...
  area: ""              # 동네 이름 (예: 성수동) - 제목과 태그에 쓰입니다
  address: ""           # 비워 두면 네이버 지역 검색으로 채웁니다
  hours: ""             # 영업시간 (직접 확인한 경우만)
  naver_search: true    # 네이버 지역 검색으로 주소/전화번호를 찾을지
  search_query: ""      # 검색이 엉뚱한 가게를 찾으면 "동네 + 가게 이름"으로 적어 주세요

visit:
  date: {date}
  with: ""              # 혼자 / 친구 / 연인 / 가족 ...
  purpose: ""           # 데이트, 작업, 브런치, 회식 ...
  waiting: ""           # 웨이팅 여부/시간
  parking: ""           # 주차 정보

# 협찬, 무료 제공, 할인 등 대가를 받았다면 true (글 맨 위에 표시 문구가 자동으로 들어갑니다)
sponsored: false
sponsor_note: ""        # 예: "OOO로부터 음료를 무료로 제공받아"

menus:
  - name: ""
    price:              # 숫자만 (예: 6500)
    comment: ""         # 맛, 양, 온도 등 느낀 점

ratings:                # 1~5, 모르면 비워 두기
  taste:
  mood:
  service:
  price:

good:
  - ""
bad:
  - ""

memo: |
  자유롭게 적어 주세요. 기억나는 장면, 직원 응대, 화장실, 콘센트 유무 등.

revisit:                # true / false / 비워 두기

# 선택: 사진별 설명과 순서. 여기 적은 순서대로 먼저 배치되고, 나머지는 촬영 시간 순입니다.
photos:
  # IMG_1234.jpg: 가게 외관
  # IMG_1240.jpg: 아인슈페너 클로즈업
